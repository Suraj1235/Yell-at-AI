<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">How Subtext reads a spoken turn</title>
  <desc id="ddesc">An animated waveform of the phrase "ship the whole thing" with the word "whole" emphasised, producing a vocalcontext/v1 evidence tag.</desc>
  <defs>
    <linearGradient id="dbg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#102a2a"/>
    </linearGradient>
    <linearGradient id="dsignal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="dGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cap   { font: 600 20px ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .word  { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7c8aa0; }
      .wordE { font: 800 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f59e0b; }
      .code  { font: 600 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d1fae5; }
      .codeE { font: 800 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f59e0b; }
      .dim   { font: 500 17px ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #94a3b8; }
      .bar   { fill: url(#dsignal); opacity: 0.82; }
      .barE  { fill: #f59e0b; opacity: 0.96; filter: url(#dGlow); }
      .chip  { fill: rgba(15, 23, 42, 0.82); stroke: rgba(148, 163, 184, 0.35); stroke-width: 1; }
      @media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }
    </style>
  </defs>

  <rect width="1280" height="300" rx="26" fill="url(#dbg)"/>
  <circle cx="120" cy="40" r="150" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="640" cy="300" r="200" fill="#60a5fa" opacity="0.06"/>

  <text x="64" y="58" class="cap">You said it like this</text>

  <!-- waveform: "ship the whole thing"; the "whole" cluster is emphasised -->
  <g transform="translate(78 150)">
    <rect class="bar"  x="0"   y="-26" width="13" height="52" rx="6"><animate attributeName="height" values="52;78;40;52" dur="1.30s" repeatCount="indefinite"/><animate attributeName="y" values="-26;-39;-20;-26" dur="1.30s" repeatCount="indefinite"/></rect>
    <rect class="bar"  x="26"  y="-34" width="13" height="68" rx="6"><animate attributeName="height" values="68;44;86;68" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="-34;-22;-43;-34" dur="1.55s" repeatCount="indefinite"/></rect>
    <rect class="bar"  x="52"  y="-22" width="13" height="44" rx="6"><animate attributeName="height" values="44;72;36;44" dur="1.20s" repeatCount="indefinite"/><animate attributeName="y" values="-22;-36;-18;-22" dur="1.20s" repeatCount="indefinite"/></rect>

    <rect class="bar"  x="92"  y="-24" width="13" height="48" rx="6"><animate attributeName="height" values="48;30;66;48" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="-24;-15;-33;-24" dur="1.45s" repeatCount="indefinite"/></rect>
    <rect class="bar"  x="118" y="-30" width="13" height="60" rx="6"><animate attributeName="height" values="60;40;80;60" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-20;-40;-30" dur="1.35s" repeatCount="indefinite"/></rect>

    <rect class="barE" x="158" y="-58" width="13" height="116" rx="6"><animate attributeName="height" values="116;150;96;116" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-58;-75;-48;-58" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect class="barE" x="184" y="-72" width="13" height="144" rx="6"><animate attributeName="height" values="144;184;120;144" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="-72;-92;-60;-72" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect class="barE" x="210" y="-64" width="13" height="128" rx="6"><animate attributeName="height" values="128;166;104;128" dur="0.90s" repeatCount="indefinite"/><animate attributeName="y" values="-64;-83;-52;-64" dur="0.90s" repeatCount="indefinite"/></rect>
    <rect class="barE" x="236" y="-78" width="13" height="156" rx="6"><animate attributeName="height" values="156;196;130;156" dur="1.00s" repeatCount="indefinite"/><animate attributeName="y" values="-78;-98;-65;-78" dur="1.00s" repeatCount="indefinite"/></rect>

    <rect class="bar"  x="276" y="-28" width="13" height="56" rx="6"><animate attributeName="height" values="56;82;42;56" dur="1.50s" repeatCount="indefinite"/><animate attributeName="y" values="-28;-41;-21;-28" dur="1.50s" repeatCount="indefinite"/></rect>
    <rect class="bar"  x="302" y="-22" width="13" height="44" rx="6"><animate attributeName="height" values="44;68;34;44" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="-22;-34;-17;-22" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect class="bar"  x="328" y="-32" width="13" height="64" rx="6"><animate attributeName="height" values="64;42;84;64" dur="1.60s" repeatCount="indefinite"/><animate attributeName="y" values="-32;-21;-42;-32" dur="1.60s" repeatCount="indefinite"/></rect>
  </g>

  <!-- word labels under their clusters -->
  <text x="92"  y="250" class="word">ship</text>
  <text x="196" y="250" class="word">the</text>
  <text x="250" y="250" class="wordE">whole</text>
  <text x="372" y="250" class="word">thing</text>

  <!-- flow arrow -->
  <g transform="translate(470 150)" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="44" y2="0"/>
    <polyline points="32,-9 44,0 32,9"/>
  </g>

  <!-- vocalcontext evidence chip; lines reveal once, waveform keeps moving -->
  <g transform="translate(548 56)">
    <rect class="chip" width="660" height="188" rx="18"/>
    <text x="28" y="48" class="code" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>&lt;vocal-context schema="vocalcontext/v1"&gt;</text>
    <text x="28" y="88" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/><tspan class="code">emphasis: </tspan><tspan class="codeE">whole</tspan><tspan class="code"> z=1.23</tspan></text>
    <text x="28" y="128" class="code" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>affect: emphatic (0.62)</text>
    <text x="28" y="166" class="dim" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>guidance: preserve &#8220;whole&#8221; as a likely constraint</text>
  </g>
</svg>
