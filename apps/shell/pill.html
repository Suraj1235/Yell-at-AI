<!doctype html>
<html lang="en" class="overlay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yell@AI overlay</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost; base-uri 'self'; form-action 'self'">
<meta name="color-scheme" content="dark">
<link rel="icon" href="./icons/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./shell.css">
<script type="module" src="./core/overlay.js"></script>
</head>
<!--
  The desktop overlay: a frameless, transparent, always-on-top, non-focusable,
  click-through window (label `pill` in tauri.conf.json). It hosts ONLY the
  shell's pill, with the same markup as index.html's .pill-layer, the same
  stylesheet and the same core/pill.js, so the overlay and the in-window pill
  cannot drift apart. It is driven by subtext://status and subtext://pill; it
  never captures, never inserts, and never calls setFocus.
-->
<body data-state="idle">
<div class="pill-layer" id="pill-layer" data-visibility="always">
  <div class="pill" id="pill" data-state="idle" role="group" aria-label="Dictation">
    <span class="pill-lamp" aria-hidden="true"></span>
    <canvas class="pill-scope" id="pill-scope" width="560" height="96" aria-hidden="true"></canvas>
    <span class="pill-msg" id="pill-msg">Hold to talk</span>
    <span class="pill-elapsed mono" id="pill-elapsed">0.0s</span>
    <button type="button" class="pill-hit" id="pill-hit" aria-describedby="pill-help">
      <span class="sr-only" id="pill-hit-label">Hold to talk</span>
    </button>
  </div>
  <div class="pill-chips" id="pill-chips" aria-hidden="true"></div>
  <p class="pill-warn" id="pill-warn" role="status" hidden></p>
  <p class="sr-only" id="pill-help">The dictation overlay. It shows the turn the Yell@AI window is running; it cannot be clicked.</p>
</div>
</body>
</html>
