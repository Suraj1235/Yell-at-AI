[package]
name = "subtext-desktop"
version = "0.1.0"
description = "Subtext desktop scaffold"
authors = ["Suraj Kuncham", "Manish Sampathirao"]
license = "LicenseRef-Subtext-NonCommercial"
edition = "2021"

[lib]
name = "subtext_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
